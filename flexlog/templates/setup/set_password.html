{% extends "_base.html" %}
{% block title %}Set Password — {{ labels.app_name }}{% endblock %}
{% block content %}
<section class="form-section">
  <h2>{{ "set_password_heading" | ui }}</h2>
  <p class="form-help">{{ "set_password_help" | ui }}</p>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('setup.set_password') }}" class="person-form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label for="password">{{ "password_label" | ui }}</label>
      <input id="password" type="password" name="password" autofocus required minlength="8">
    </div>
    <div class="form-row">
      <label for="password_confirm">{{ "password_confirm_label" | ui }}</label>
      <input id="password_confirm" type="password" name="password_confirm" required minlength="8">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ "set_password_submit" | ui }}</button>
    </div>
  </form>
</section>
{% endblock %}
